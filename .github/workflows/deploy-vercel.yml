name: Deploy to Vercel

# CLI-based deploy: doesn't need the Vercel GitHub App installed on this
# org repo (that requires org-admin approval). Auth is via VERCEL_TOKEN
# instead.
#
# Two independent Vercel projects (website, business) share one repo.
# `changes` detects which app(s) are affected by a push — either the
# app's own folder or a shared package/root manifest — and gates the
# two deploy jobs independently. Visibility toggle stays centralized
# (make-repo-public -> deploys -> make-repo-private) so two concurrent
# workflow runs can't race each other's public/private flips.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.filter.outputs.website }}
      business: ${{ steps.filter.outputs.business }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            website:
              - 'apps/website/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
            business:
              - 'apps/business/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'

  make-repo-public:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.website == 'true' || needs.changes.outputs.business == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Make repo public
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: gh api -X PATCH "repos/${{ github.repository }}" -f visibility=public

  deploy-website:
    needs: [changes, make-repo-public]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Pull Vercel environment info
        working-directory: apps/website
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEBSITE }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        working-directory: apps/website
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEBSITE }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        working-directory: apps/website
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEBSITE }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-business:
    needs: [changes, make-repo-public]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.business == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Pull Vercel environment info
        working-directory: apps/business
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BUSINESS }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        working-directory: apps/business
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BUSINESS }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_BUSINESS_URL: ${{ secrets.NEXT_PUBLIC_BUSINESS_URL }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        working-directory: apps/business
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BUSINESS }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  make-repo-private:
    needs: [changes, make-repo-public, deploy-website, deploy-business]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.website == 'true' || needs.changes.outputs.business == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Make repo private
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: gh api -X PATCH "repos/${{ github.repository }}" -f visibility=private
