name: Deploy to Vercel

# CLI-based deploy: doesn't need the Vercel GitHub App installed on this
# org repo (that requires org-admin approval). Auth is via VERCEL_TOKEN
# instead.
#
# Two independent Vercel projects (website, business) share one repo,
# built via a matrix. `changes` detects which app(s) are affected by a
# push — either the app's own folder or a shared package/root manifest —
# and gates each matrix leg independently. Visibility toggle stays
# centralized (make-repo-public -> deploy -> make-repo-private) so two
# concurrent workflow runs can't race each other's public/private flips.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.filter.outputs.website }}
      business: ${{ steps.filter.outputs.business }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            website:
              - 'apps/website/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'bun.lockb'
              - 'turbo.json'
            business:
              - 'apps/business/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'bun.lockb'
              - 'turbo.json'

  make-repo-public:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.website == 'true' || needs.changes.outputs.business == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Make repo public
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: gh api -X PATCH "repos/${{ github.repository }}" -f visibility=public

  deploy:
    needs: [changes, make-repo-public]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: website
            project_id: VERCEL_PROJECT_ID_WEBSITE
            should_run: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.website == 'true' }}
          - app: business
            project_id: VERCEL_PROJECT_ID_BUSINESS
            should_run: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.business == 'true' }}

    steps:
      - name: Checkout
        if: matrix.should_run == true
        uses: actions/checkout@v4

      - name: Setup Bun
        if: matrix.should_run == true
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0

      - name: Cache Bun dependencies
        if: matrix.should_run == true
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        if: matrix.should_run == true
        run: bun install --frozen-lockfile

      - name: Pull Vercel environment info
        if: matrix.should_run == true
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id] }}
        run: bunx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        if: matrix.should_run == true
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id] }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BUSINESS_URL: ${{ secrets.NEXT_PUBLIC_BUSINESS_URL }}
        run: bunx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        if: matrix.should_run == true
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id] }}
        run: bunx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  make-repo-private:
    needs: [changes, make-repo-public, deploy]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.website == 'true' || needs.changes.outputs.business == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Make repo private
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: gh api -X PATCH "repos/${{ github.repository }}" -f visibility=private
